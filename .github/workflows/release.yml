name: Release
on:
  workflow_dispatch:
   inputs:
     version:
       description: "The version to release, without the leading `v`"
       required: true
     checkout_ref:
       description: 'Override the ref to checkout (defaults to the triggering ref)'
       required: false
       default: ''

permissions:
  contents: write

# This repository releases a controller image only. The OLM bundle, catalog and the community
# bundle PRs are gone: the Workload Availability Operator (WAO) packages this controller as one of
# its operands and is the only thing shipped to a catalog. See README.md, "Packaging".
jobs:
  push_to_registry:
    name: Build and push the versioned controller image to quay.io/medik8s
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Log inputs
        run: echo "Building version ${VERSION}"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io

      - name: Build and push the controller image
        run: VERSION=$VERSION make container-build container-push CONTAINER_TOOL=docker

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          body: |
            # Self Node Remediation v${{ inputs.version }}

            ## Notable Changes

            * TODO

            ## Release Artifacts

            ### Images
            * Controller: quay.io/medik8s/self-node-remediation-operator:v${{ inputs.version }}

            This release does not publish an OLM bundle or catalog. The controller is deployed by
            the Workload Availability Operator, which owns the packaging and the RBAC.
